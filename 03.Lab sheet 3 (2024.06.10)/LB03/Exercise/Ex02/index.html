<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo Application</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-5">ToDo Application</h1>
        <form id="taskForm" class="mb-4">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" class="form-control" id="title" placeholder="Enter task title" required>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control" id="description" rows="3" placeholder="Enter task description"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Task</button>
        </form>

        <h2>Tasks</h2>
        <ul id="taskList" class="list-group">
            <!-- Tasks will be added here dynamically -->
        </ul>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        // JavaScript to handle form submission and task display
        document.getElementById('taskForm').addEventListener('submit', function(event) {
            event.preventDefault();

            var title = document.getElementById('title').value;
            var description = document.getElementById('description').value;

            // Create a new list item for the task
            var li = document.createElement('li');
            li.className = 'list-group-item';
            li.innerHTML = `<strong>${title}</strong><p>${description}</p>`;

            // Add the list item to the task list
            document.getElementById('taskList').appendChild(li);

            // Clear the form
            document.getElementById('taskForm').reset();
        });
    </script>
</body>
</html>
