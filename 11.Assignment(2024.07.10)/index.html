<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="styles/style.css">
    <title>Book Management</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-5">Book Management System</h1>
        <div class="card p-4 shadow-sm mb-5">
            <div class="row mb-3">
                <label for="title" class="col-sm-2 col-form-label">Title</label>
                <div class="col-sm-4">
                    <input type="text" class="form-control" id="title">
                </div>
                <label for="author" class="col-sm-2 col-form-label">Author</label>
                <div class="col-sm-4">
                    <input type="text" class="form-control" id="author">
                </div>
            </div>
            <div class="row mb-3">
                <label for="isbn" class="col-sm-2 col-form-label">ISBN</label>
                <div class="col-sm-4">
                    <input type="text" class="form-control" id="isbn">
                </div>
                <label for="price" class="col-sm-2 col-form-label">Price</label>
                <div class="col-sm-4">
                    <input type="number" class="form-control" id="price">
                </div>
            </div>
            <div class="row mb-3">
                <label for="description" class="col-sm-2 col-form-label">Description</label>
                <div class="col-sm-10">
                    <textarea class="form-control" placeholder="Description" id="description" style="height: 100px"></textarea>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-sm-4 mb-2">
                    <button type="button" class="btn btn-success w-100" id="add-btn" onclick="add()">Add</button>
                </div>
                <div class="col-sm-4 mb-2">
                    <button type="button" class="btn btn-warning w-100" id="update-btn" onclick="update()" disabled>Update</button>
                </div>
                <div class="col-sm-4 mb-2">
                    <button type="button" class="btn btn-danger w-100" id="delete-btn" onclick="deleteBook()" disabled>Delete</button>
                </div>
            </div>
        </div>
        <div class="card p-4 shadow-sm">
            <table class="table table-hover table-bordered">
                <thead class="table-dark">
                    <tr>
                        <th>Book ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>ISBN</th>
                        <th>Price</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="book-table-body"></tbody>
            </table>
        </div>
    </div>
    <script src="script/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
